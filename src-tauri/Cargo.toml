[package]
name = "pdf-studio"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
description = "PDF Studio desktop shell and native analysis engine"
license = "MIT"

[lib]
name = "pdf_studio_lib"
path = "src/lib.rs"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "pdf-studio"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
rayon = "1.10"
regex = "1.10"
sha2 = "0.10"
thiserror = "2"
unicode-segmentation = "1.11"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
